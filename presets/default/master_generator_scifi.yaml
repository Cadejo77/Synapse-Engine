template:
- __subject_prompt__ , __scene_prompt__ , __shared/scene/composition__
subject_prompt:
- __genre_selector__
- __content_type__
- __mode_selector__
- __vibe_selector__
- __action_selector__
- __character_count__
genre_selector:
- 85, meta:genre:fantasy
- 15, meta:genre:scifi
content_type:
- 40, meta:content:action
- 15, meta:content:portrait
- 25, meta:content:landscape
- 20, meta:content:nude
vibe_selector:
- /meta:content:nude/ 45, meta:vibe:romantic
- /meta:content:nude/ 10, meta:vibe:calm
- /meta:content:nude/ 45, meta:vibe:explicit
- 50, meta:vibe:dark
- 15, meta:vibe:adventurous
- 5, meta:vibe:romantic
- 10, meta:vibe:explicit
- 15, meta:vibe:epic
- 5, meta:vibe:calm
character_count:
- /meta:mode:world/ 140, meta:count:zero, __no_characters__
- /meta:mode:studio/ 75, meta:count:single, __studio_single_character__
- /meta:mode:studio/ 18, meta:count:multiple, __studio_dual_characters__
- /meta:mode:studio/ 7, meta:count:multiple, __studio_group_characters__
- 75, meta:count:single, __single_character__
- /meta:action:duel/ 25, meta:count:multiple, __dual_characters__
- /meta:action:rescue/ 20, meta:count:multiple, __dual_characters__
- /meta:action:conversation/ 12, meta:count:multiple, __conversation_characters__
- /meta:action:negotiation/ 10, meta:count:multiple, __conversation_characters__
- /meta:action:trading/ 8, meta:count:multiple, __conversation_characters__
- /meta:action:boss_battle/ 30, meta:count:multiple, __group_characters__
- /meta:action:ritual/ 25, meta:count:multiple, __group_characters__
- /meta:action:team_fight/ 30, meta:count:multiple, __group_characters__
- /meta:content:nude/ 5, meta:count:multiple, __nude_group__
- /meta:vibe:romantic/ 8, meta:count:multiple, __romantic_pair__
single_character:
- /meta:genre:fantasy/ 50, 1girl, meta:gender:female, __fantasy_complete_character__
- /meta:genre:fantasy/ 50, 1boy, meta:gender:male, __fantasy_complete_character__
- /meta:genre:scifi/ 50, 1girl, meta:gender:female, __scifi_complete_character__
- /meta:genre:scifi/ 50, 1boy, meta:gender:male, __scifi_complete_character__
dual_characters:
- /meta:genre:fantasy/ 30, 2girls, meta:gender:female, __fantasy_complete_character__, rival, meta:gender:female, __fantasy_complete_character__
- /meta:genre:fantasy/ 30, 2boys, meta:gender:male, __fantasy_complete_character__, rival, meta:gender:male, __fantasy_complete_character__
- /meta:genre:fantasy/ 40, 1boy and 1girl, meta:gender:male, __fantasy_complete_character__, fighting, meta:gender:female,
  __fantasy_complete_character__
- /meta:genre:scifi/ 30, 2girls, meta:gender:female, __scifi_complete_character__, rival, meta:gender:female, __scifi_complete_character__
- /meta:genre:scifi/ 30, 2boys, meta:gender:male, __scifi_complete_character__, rival, meta:gender:male, __scifi_complete_character__
- /meta:genre:scifi/ 40, 1boy and 1girl, meta:gender:male, __scifi_complete_character__, fighting, meta:gender:female, __scifi_complete_character__
conversation_characters:
- /meta:genre:fantasy/ 50, 1boy and 1girl, __fantasy_complete_character__, talking with __fantasy_complete_character__
- /meta:genre:fantasy/ 25, 2girls, __fantasy_complete_character__, talking with __fantasy_complete_character__
- /meta:genre:fantasy/ 25, 2boys, __fantasy_complete_character__, talking with __fantasy_complete_character__
- /meta:genre:scifi/ 50, 1boy and 1girl, __scifi_complete_character__, talking with __scifi_complete_character__
- /meta:genre:scifi/ 25, 2girls, __scifi_complete_character__, talking with __scifi_complete_character__
- /meta:genre:scifi/ 25, 2boys, __scifi_complete_character__, talking with __scifi_complete_character__
group_characters:
- /meta:genre:fantasy/ 100, group of adventurers, __fantasy_complete_character__, __fantasy_complete_character__, __fantasy_complete_character__
- /meta:genre:scifi/ 100, squad of soldiers, __scifi_complete_character__, __scifi_complete_character__, __scifi_complete_character__
romantic_pair:
- /meta:genre:fantasy/ 100, 1boy and 1girl, romantic __fantasy_complete_character__, intimate __fantasy_complete_character__
- /meta:genre:scifi/ 100, 1boy and 1girl, romantic __scifi_complete_character__, intimate __scifi_complete_character__
nude_group:
- /meta:genre:fantasy/ 60, 2girls, meta:gender:female, meta:content:nude, __fantasy_complete_character__, bathing with, meta:gender:female,
  meta:content:nude, __fantasy_complete_character__, hot springs
- /meta:genre:fantasy/ 30, 1girl, meta:gender:female, meta:content:nude, __fantasy_complete_character__, bathing alone
- /meta:genre:fantasy/ 10, 1boy and 1girl, meta:gender:male, meta:content:nude, __fantasy_complete_character__, intimate with,
  meta:gender:female, meta:content:nude, __fantasy_complete_character__
- /meta:genre:scifi/ 70, 1girl, meta:gender:female, meta:content:nude, __scifi_complete_character__, cybernetic enhancements
- /meta:genre:scifi/ 30, 1boy and 1girl, meta:gender:male, meta:content:nude, __scifi_complete_character__, intimate with,
  meta:gender:female, meta:content:nude, __scifi_complete_character__, futuristic setting
