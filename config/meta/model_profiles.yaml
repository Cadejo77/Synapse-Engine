model_profiles:
  sdxl:
    name: "SDXL (Stable Diffusion XL)"
    formatter: "tags"
    emphasis_syntax: "parentheses"  # (word) to boost, [word] to suppress
    quality_tags:
      - "masterpiece"
      - "best quality"
      - "high resolution"
    default_negative_prompts:
      - "ugly"
      - "deformed" 
      - "bad hands"
      - "worst quality"
      - "lowres"
      - "bad anatomy"
      - "bad proportions"
      - "blurry"
    prompt_order:
      - "quality"
      - "subject" 
      - "environment"
      - "style"
      - "enhancers"
    supports_negative_prompts: true
    
  flux:
    name: "Flux.1"
    formatter: "prose"
    emphasis_syntax: "brackets"  # [important phrase] for emphasis
    quality_tags: []  # Flux prefers descriptive detail over quality tags
    default_negative_prompts: []  # Often not needed for Flux
    prompt_order:
      - "natural_description"
    supports_negative_prompts: false
    natural_language: true
    
  illustrious_xl:
    name: "Illustrious XL"
    formatter: "tags"
    emphasis_syntax: "tag_order"  # Order and positioning matters most
    quality_tags:
      - "masterpiece"
      - "amazing quality"
      - "very aesthetic"
    default_negative_prompts:
      - "lowres"
      - "bad anatomy"
      - "bad hands"
      - "text"
      - "error"
      - "missing fingers"
      - "extra digit"
      - "fewer digits"
    prompt_order:
      - "quality"
      - "rating"
      - "subject"
      - "pose"
      - "background"
      - "style"
      - "enhancers"
    supports_negative_prompts: true
    danbooru_tags: true
    
  pony:
    name: "Pony Diffusion XL"  
    formatter: "tags"
    emphasis_syntax: "score_tokens"
    quality_tags:
      - "score_9"
      - "score_8_up" 
      - "score_7_up"
    special_tokens:
      - "source_anime"
      - "source_pony"
      - "rating_safe"
    default_negative_prompts: []  # Limited negative prompt usage recommended
    prompt_order:
      - "score_quality"
      - "source_rating"
      - "subject"
      - "style"
    supports_negative_prompts: false
    anime_focused: true

metadata:
  version: 1
  notes: "Model-specific prompt formatting profiles for optimal generation"