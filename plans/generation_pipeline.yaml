pipeline:
  mode_selector:
    compositional_chance: 0.7
  order:
    - genre
    - rarity
    - vibe
    - content_type
    - branch
    - composition
    - style
    - finalize
  figure_dimensions:
    required: [species, archetypes]
    optional:
      - physiques
      - emotions
      - conditions
      - power_sources
      - gear_primary
      - gear_secondary
      - modifiers
  landscape_dimensions:
    required: [biomes]
    optional:
      - structures
      - atmosphere_mood
      - weather
      - time_of_day
      - special_fx
  style_dimensions:
    order:
      - palettes
      - lighting
      - camera
      - media
      - depth_effects
      - framing
      - focus_styles
      - quality_combo
  constraints:
    max_modifiers: 4
    max_special_fx: 2
  rarity_rules:
    rare_allows_extra_modifier: true
    epic_adds_depth_effects: true
metadata:
  version: 1